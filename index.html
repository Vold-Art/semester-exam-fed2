<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Auction House - Browse Listings</title>
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="stylesheet" href="./css/style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<header id="main-header"></header>

		<section id="search-section" class="search-section">
			<div class="search-inner">
				<label for="search-input" class="sr-only">Search listings</label>

				<input
					type="search"
					id="search-input"
					class="search-input"
					placeholder="Search listings..."
				/>

				<button id="search-btn" class="btn btn-secondary">Search</button>
			</div>
		</section>

		<section class="listing-container">
			<h1 class="page-title">Auction Listings</h1>

			<p id="listing-status" class="sr-only" aria-live="polite"></p>

			<section id="listings" class="listing-grid" aria-live="polite"></section>

			<nav
				id="pagination"
				class="pagination"
				aria-label="Listings pagination"
			></nav>

			<p
				id="listings-error"
				class="error-text"
				role="alert"
				aria-live="assertive"
			></p>
		</section>

		<script type="module" src="./js/utils/header.js"></script>
		<script type="module" src="./js/index.js"></script>

		<footer class="site-footer">
			<p>
				© 2025 Noroff Auction House. Designed & Developed by Arnt Helge Vold
			</p>
		</footer>
	</body>
</html>
